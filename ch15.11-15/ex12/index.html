<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>OneDrive アップロード</title>
</head>

<body>
    <h1>OneDrive ファイルアップロード</h1>
    <div>
        <textarea id="token" placeholder="アクセストークン"></textarea>
    </div>
    <div>
        <input type="file" id="file">
    </div>
    <div>
        <button id="upload">アップロード</button>
    </div>
    <div>
        <p>結果：</p>
        <span id="result"></span>
    </div>
    <script src="index.js"></script>
</body>

</html>
