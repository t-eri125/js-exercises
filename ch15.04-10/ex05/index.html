<!DOCTYPE html>
<html lang="ja">

<head>
    <title></title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
</head>

<body>
    <p>
        <inline-circle color="#308691">文字を入れてみる</inline-circle>
        <inline-circle color="#ff0000" width="10px" height="5px"></inline-circle>
    </p>

    <script>
        /** https://developer.mozilla.org/ja/docs/Web/API/Web_components/Using_custom_elements */
        class InlineCircle extends HTMLElement {

            constructor() {
                // コンストラクターでは、常に super を最初に呼び出す
                super();
            }

            connectedCallback() {
                // 円の作成に必要なスタイルを設定する。
                this.style.display = "inline-block";
                this.style.borderRadius = "50%";
                this.style.borderStyle = "solid";
                this.style.borderWidth = "10px";
            }

            static get observedAttributes() {
                return ["color", "width", "height"];
            }

            attributeChangedCallback(name, oldValue, newValue) {
                switch (name) {
                    case "color":
                        // color 属性が変更された場合、色を変更する。
                        this.style.borderColor = newValue;
                        break;
                    case "width":
                        // width 属性が変更された場合、幅を変更する。
                        this.style.width = newValue;
                        break;
                    case "height":
                        // height 属性が変更された場合、高さを変更する。
                        this.style.height = newValue;
                        break;
                }
            }
            // 要素の属性に対応するJavaScript プロパティを定義する。ここで
            // 定義したゲッターとセッターは、属性を読み出したり設定したり
            // するだけ。JavaScript のプロパティが設定されると、属性が設定
            // される。そして、attributeChangedCallback() が呼び出され、
            // 要素のスタイルが更新される。
            get color() { return this.getAttribute("color"); }
            set color(color) { this.setAttribute("color", color); }
            get width() { return this.getAttribute("width"); }
            set width(width) { this.setAttribute("width", width); }
            get height() { return this.getAttribute("height"); }
            set height(height) { this.setAttribute("height", height); }
        }

        customElements.define("inline-circle", InlineCircle);
    </script>
</body>

</html>
